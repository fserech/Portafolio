<nav [class]="'fixed top-0 left-0 right-0 z-50 transition-all duration-300 ' +
  (scrolled()
    ? 'bg-white/90 dark:bg-gray-900/90 backdrop-blur-md shadow-sm border-b border-gray-200/50 dark:border-gray-800/50'
    : 'bg-transparent')">
  <div class="w-full px-4 sm:px-6 lg:px-12">
    <div class="flex justify-between items-center h-16">

      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center">
        <a href="#" class="font-bold text-xl tracking-tighter transition-colors text-gray-900 dark:text-white">
          fredy@<span class="text-blue-600 dark:text-blue-500">SecOps</span>
        </a>
      </div>

      <!-- Desktop: Nav links + Theme toggle -->
      <div class="hidden md:flex items-center gap-6">
         @for (link of navLinks; track link) {
          <a
            [href]="link.href"
            class="px-3 py-2 rounded-md text-sm font-medium transition-colors text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400">
            
            {{ link.name }}
          </a>
        }

        <!-- Theme toggle -->
        <button (click)="themeService.toggleTheme()"
          class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
          aria-label="Toggle Dark Mode">
          @if (!themeService.darkMode()) {
            <lucide-angular [img]="Moon" [size]="20"></lucide-angular>
          }
          @if (themeService.darkMode()) {
            <lucide-angular [img]="Sun" [size]="20"></lucide-angular>
          }
        </button>
      </div>

      <!-- Mobile: theme + hamburger -->
      <div class="md:hidden flex items-center gap-3">
        <button (click)="themeService.toggleTheme()"
          class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
          @if (!themeService.darkMode()) {
            <lucide-angular [img]="Moon" [size]="20"></lucide-angular>
          }
          @if (themeService.darkMode()) {
            <lucide-angular [img]="Sun" [size]="20"></lucide-angular>
          }
        </button>
        <button (click)="toggleMenu()" class="transition-colors text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">
          @if (!isOpen()) {
            <lucide-angular [img]="Menu" [size]="24"></lucide-angular>
          }
          @if (isOpen()) {
            <lucide-angular [img]="X" [size]="24"></lucide-angular>
          }
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  @if (isOpen()) {
    <div class="md:hidden border-t bg-white/85 dark:bg-gray-900/85 backdrop-blur-sm border-gray-100 dark:border-gray-800" [@slideDown]>
      <div class="px-2 pt-2 pb-4 space-y-1 sm:px-3">
         @for (link of navLinks; track link) {
         
            <a [href]="link.href"
            (click)="closeMenu()"
            class="block px-3 py-2 rounded-md text-base font-medium transition-colors text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-gray-50 dark:hover:bg-gray-800">
            {{ link.name }}
          </a>
        }
      </div>
    </div>
  }
</nav>
