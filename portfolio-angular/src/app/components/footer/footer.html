<footer class="border-t transition-colors duration-500 bg-white/85 dark:bg-gray-900/85 backdrop-blur-sm border-gray-200 dark:border-gray-800">
  <div class="w-full px-4 sm:px-6 lg:px-12 py-8">
    <div class="flex justify-between items-center
                max-[575.98px]:flex-col max-[575.98px]:gap-5
                min-[768px]:max-[991.98px]:flex-col min-[768px]:max-[991.98px]:gap-6
                min-[992px]:flex-row min-[992px]:gap-6">

      <!-- Logo -->
      <div class="max-[575.98px]:order-1 min-[992px]:text-left min-[992px]:order-1 text-center">
        <h3 class="font-bold font-mono mb-2 text-lg text-gray-900 dark:text-white">
          fredy@<span class="text-blue-600 dark:text-blue-500">dev</span>
        </h3>
        <p class="text-sm text-gray-600 dark:text-gray-400">
          Security & Network Professional · Developer
        </p>
      </div>

      <!-- Copyright -->
      <div class="text-center max-[575.98px]:order-3 min-[768px]:max-[991.98px]:order-3 min-[992px]:order-2">
        <p class="text-sm text-gray-600 dark:text-gray-400">
          © {{ currentYear }} Hecho con pasión usando Angular & Tailwind CSS
        </p>
      </div>

      <!-- Links + socials -->
      <div class="flex items-center
                  max-[575.98px]:flex-col max-[575.98px]:gap-4 max-[575.98px]:order-2
                  min-[768px]:flex-row min-[768px]:gap-5 min-[768px]:order-2
                  min-[992px]:gap-6 min-[992px]:order-3">

        <div class="flex items-center gap-6">
          @for (link of [
            {name: 'Inicio', href: '#home'},
            {name: 'Proyectos', href: '#projects'},
            {name: 'Contacto', href: '#contact'}]; track link) {
             <a
              [href]="link.href"
              class="text-sm transition-colors text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-500">
              {{ link.name }}
            </a>
          }
        </div>

        <div class="flex gap-4 border-gray-300 dark:border-gray-700
                    max-[575.98px]:border-t max-[575.98px]:pt-4
                    min-[992px]:ml-4 min-[992px]:pl-4 min-[992px]:border-l min-[992px]:border-t-0 min-[992px]:pt-0">
          <a href="https://github.com/fserech" target="_blank" rel="noopener noreferrer"
             class="transition-colors text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-500">
            <lucide-angular [img]="Github" class="w-[18px] h-[18px]"></lucide-angular>
          </a>
          <a href="https://www.linkedin.com/in/fredy-serech-08a11a246" target="_blank" rel="noopener noreferrer"
             class="transition-colors text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-500">
            <lucide-angular [img]="Linkedin" class="w-[18px] h-[18px]"></lucide-angular>
          </a>
          <a href="mailto:serech63@gmail.com"
             class="transition-colors text-gray-600 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-500">
            <lucide-angular [img]="Mail" class="w-[18px] h-[18px]"></lucide-angular>
          </a>
        </div>
      </div>
    </div>
  </div>
</footer>
