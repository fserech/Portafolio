<footer class="bg-gray-900 dark:bg-black text-gray-300 py-12 border-t border-gray-800 dark:border-gray-800 transition-colors duration-300">
  <div class="w-full px-4 sm:px-6 lg:px-12">
    <div class="flex flex-col md:flex-row justify-between items-center gap-6">

      <div class="text-center md:text-left">
        <h3 class="text-2xl font-bold text-white mb-2">
          DEV<span class="text-blue-500">FOLIO</span>
        </h3>
        <p class="text-sm text-gray-400">
          Construyendo el futuro de la web, un píxel a la vez.
        </p>
      </div>

      <div class="flex gap-6">
        <a href="#" class="hover:text-blue-500 transition-colors">
          <lucide-angular [img]="Github" [size]="20"></lucide-angular>
        </a>
        <a href="#" class="hover:text-blue-500 transition-colors">
          <lucide-angular [img]="Linkedin" [size]="20"></lucide-angular>
        </a>
        <a href="#" class="hover:text-blue-500 transition-colors">
          <lucide-angular [img]="Twitter" [size]="20"></lucide-angular>
        </a>
      </div>
    </div>

    <div class="mt-8 pt-8 border-t border-gray-800 dark:border-gray-800 flex flex-col sm:flex-row justify-between items-center text-sm text-gray-500">
      <p>© {{ currentYear }} DevFolio. Todos los derechos reservados.</p>
      <p class="flex items-center gap-1 mt-2 sm:mt-0">
        Hecho con
        <lucide-angular [img]="Heart" [size]="14" class="text-red-500 fill-red-500"></lucide-angular>
        usando Angular & Tailwind
      </p>
    </div>
  </div>
</footer>
