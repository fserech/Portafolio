<section id="skills" class="transition-colors duration-500 max-[575.98px]:py-12 min-[768px]:max-[991.98px]:py-16 min-[992px]:py-20 bg-gray-50/85 dark:bg-gray-950/85 backdrop-blur-sm">

  <div class="w-full px-4 sm:px-6 lg:px-12 relative">

    <!-- ── Header ─────────────────────────────────────────────────────── -->
    <div class="text-center max-[575.98px]:mb-10 min-[768px]:max-[991.98px]:mb-12 min-[992px]:mb-16">
      <h2 class="font-bold text-gray-900 dark:text-white transition-colors
                 max-[575.98px]:text-2xl min-[768px]:max-[991.98px]:text-3xl min-[992px]:text-4xl">
        Habilidades Técnicas
      </h2>
      <p class="mt-4 text-gray-500 dark:text-gray-400 max-w-3xl mx-auto
                max-[575.98px]:text-base min-[992px]:text-xl">
        Mi stack de seguridad y tecnológico, y las herramientas que utilizo en mi día a día.
      </p>
    </div>

    <!-- ── Skills Grid ─────────────────────────────────────────────────── -->
    <div class="grid max-[575.98px]:grid-cols-1 max-[575.98px]:gap-4
                min-[768px]:max-[991.98px]:grid-cols-2 min-[768px]:max-[991.98px]:gap-5
                min-[992px]:max-[1199.98px]:grid-cols-4 min-[992px]:max-[1199.98px]:gap-5
                min-[1200px]:grid-cols-4 min-[1200px]:gap-6">

      @for (category of categories(); track category.id; let i = $index) {
        <div class="rounded-xl skill-card transition-all duration-300 bg-white dark:bg-gray-800 shadow-sm hover:shadow-md border border-gray-100 dark:border-gray-700 p-6"
             [style.animation-delay.ms]="i * 100">
          <div class="flex items-center justify-between pb-2 mb-4 border-b border-gray-100 dark:border-gray-700">
            <h3 class="font-bold transition-colors text-gray-900 dark:text-white text-lg">
              {{ category.title }}
            </h3>
          </div>
          <div class="flex flex-col gap-3 mb-4">
            @for (skill of category.skills; track skill.id) {
                <span class="text-sm font-medium px-3 py-1.5 rounded-full bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 border border-blue-100 dark:border-blue-800">
                  {{ skill.name }}
                </span>
              }
          </div>
        </div>
      }

    </div>
  </div>
</section>
