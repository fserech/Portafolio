<section id="skills"
  [class]="'transition-colors duration-500 max-[575.98px]:py-12 min-[768px]:max-[991.98px]:py-16 min-[992px]:py-20 ' +
           (activeMode() === 'dev' ? 'bg-gray-50 dark:bg-gray-950' : 'bg-gray-950 dark:bg-gray-950 sec-bg')">

  <!-- Scanline overlay (security mode) -->
  <div *ngIf="activeMode() === 'security'" class="scanlines-overlay pointer-events-none"></div>

  <div class="w-full px-4 sm:px-6 lg:px-12 relative">

    <!-- ── Header ─────────────────────────────────────────────────────── -->
    <div class="text-center max-[575.98px]:mb-10 min-[768px]:max-[991.98px]:mb-12 min-[992px]:mb-16">

      <!-- Mode Tabs -->
      <div class="inline-flex rounded-xl p-1 mb-8 mode-tabs"
           [class]="activeMode() === 'dev'
             ? 'bg-gray-200 dark:bg-gray-800'
             : 'bg-gray-900 border border-green-500/30'">
        <button (click)="setMode('dev')"
          [class]="'flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-300 ' +
            (activeMode() === 'dev'
              ? 'bg-white dark:bg-gray-700 text-blue-600 dark:text-blue-400 shadow-sm'
              : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300')">
          <lucide-angular [img]="Code2" class="w-4 h-4"></lucide-angular>
          Desarrollador
        </button>
        <button (click)="setMode('security')"
          [class]="'flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-300 ' +
            (activeMode() === 'security'
              ? 'bg-green-500/20 text-green-400 border border-green-500/50 shadow-[0_0_12px_rgba(34,197,94,0.3)]'
              : 'text-gray-500 dark:text-gray-400 hover:text-gray-300')">
          <lucide-angular [img]="Shield" class="w-4 h-4"></lucide-angular>
          Seguridad
        </button>
      </div>

      <!-- Title -->
      <h2 *ngIf="activeMode() === 'dev'"
          class="font-bold text-gray-900 dark:text-white transition-colors
                 max-[575.98px]:text-2xl min-[768px]:max-[991.98px]:text-3xl min-[992px]:text-4xl">
        Habilidades Técnicas
      </h2>
      <h2 *ngIf="activeMode() === 'security'"
          class="font-mono font-bold transition-colors text-green-400 glitch-text
                 max-[575.98px]:text-2xl min-[768px]:max-[991.98px]:text-3xl min-[992px]:text-4xl"
          data-text="./skills --mode=security">
        <span class="text-green-600 mr-1">$</span> ./skills <span class="text-green-300">--mode=security</span>
      </h2>

      <p *ngIf="activeMode() === 'dev'"
         class="mt-4 text-gray-500 dark:text-gray-400 max-w-3xl mx-auto
                max-[575.98px]:text-base min-[992px]:text-xl">
        Mi stack tecnológico actual y herramientas que utilizo en mi día a día.
      </p>
      <p *ngIf="activeMode() === 'security'"
         class="mt-4 font-mono text-green-600/80 max-w-3xl mx-auto text-sm tracking-wider">
        <span class="text-green-500">[INFO]</span> Cargando arsenal de herramientas de seguridad...
        <span class="terminal-cursor">▋</span>
      </p>
    </div>

    <!-- ── Skills Grid ─────────────────────────────────────────────────── -->
    <div class="grid max-[575.98px]:grid-cols-1 max-[575.98px]:gap-4
                min-[768px]:max-[991.98px]:grid-cols-2 min-[768px]:max-[991.98px]:gap-5
                min-[992px]:max-[1199.98px]:grid-cols-4 min-[992px]:max-[1199.98px]:gap-5
                min-[1200px]:grid-cols-4 min-[1200px]:gap-6">

      <div *ngFor="let category of currentCategories(); let i = index"
           [class]="'rounded-xl skill-card transition-all duration-300 ' +
             (activeMode() === 'dev'
               ? 'bg-white dark:bg-gray-800 shadow-sm hover:shadow-md border border-gray-100 dark:border-gray-700 p-6'
               : 'bg-gray-900/80 border border-green-500/20 hover:border-green-500/50 hover:shadow-[0_0_20px_rgba(34,197,94,0.15)] p-6 sec-card')"
           [style.animation-delay.ms]="i * 100">

        <!-- Category header -->
        <div class="flex items-center justify-between pb-2 mb-4"
             [class]="activeMode() === 'dev'
               ? 'border-b border-gray-100 dark:border-gray-700'
               : 'border-b border-green-500/20'">

          <ng-container *ngIf="editingCategoryId() !== category.id; else editCatTpl">
            <h3 [class]="'font-bold transition-colors ' +
                  (activeMode() === 'dev'
                    ? 'text-gray-900 dark:text-white text-lg'
                    : 'text-green-400 font-mono text-base')">
              <span *ngIf="activeMode() === 'security'" class="text-green-700 mr-1">[</span>
              {{ category.title }}
              <span *ngIf="activeMode() === 'security'" class="text-green-700 ml-1">]</span>
            </h3>
            <div *ngIf="!readOnly" class="flex items-center gap-1">
              <button (click)="startEditCategory(category)"
                      [class]="'p-1 rounded transition-colors ' +
                        (activeMode() === 'dev'
                          ? 'text-gray-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20'
                          : 'text-green-700 hover:text-green-400')">
                <lucide-angular [img]="Edit2" class="w-3.5 h-3.5"></lucide-angular>
              </button>
              <button (click)="deleteCategory(category.id)"
                      [class]="'p-1 rounded transition-colors ' +
                        (activeMode() === 'dev'
                          ? 'text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20'
                          : 'text-green-700 hover:text-red-400')">
                <lucide-angular [img]="X" class="w-3.5 h-3.5"></lucide-angular>
              </button>
            </div>
          </ng-container>

          <ng-template #editCatTpl>
            <input [(ngModel)]="editCategoryName" (keyup.enter)="confirmEditCategory(category.id)"
                   [class]="'flex-1 mr-2 text-sm px-2 py-1 rounded border outline-none ' +
                     (activeMode() === 'dev'
                       ? 'border-blue-300 bg-white dark:bg-gray-700 dark:text-white'
                       : 'border-green-500/50 bg-gray-900 text-green-300 font-mono')" />
            <button (click)="confirmEditCategory(category.id)"
                    [class]="'p-1 rounded ' + (activeMode() === 'dev' ? 'text-green-500' : 'text-green-400')">
              <lucide-angular [img]="Check" class="w-3.5 h-3.5"></lucide-angular>
            </button>
          </ng-template>
        </div>

        <!-- Skills list -->
        <div class="flex flex-wrap gap-2 mb-4">
          <ng-container *ngFor="let skill of category.skills">
            <ng-container *ngIf="editingSkillId() !== skill.id; else editSkillTpl">

              <!-- DEV mode pill -->
              <div *ngIf="activeMode() === 'dev'"
                   class="group relative flex items-center gap-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-full px-3 py-1.5 text-sm font-medium">
                {{ skill.name }}
                <div *ngIf="!readOnly" class="hidden group-hover:flex items-center gap-0.5 ml-1">
                  <button (click)="startEditSkill(skill)" class="text-gray-400 hover:text-blue-500 transition-colors">
                    <lucide-angular [img]="Edit2" class="w-3 h-3"></lucide-angular>
                  </button>
                  <button (click)="deleteSkill(category.id, skill.id)" class="text-gray-400 hover:text-red-500 transition-colors">
                    <lucide-angular [img]="X" class="w-3 h-3"></lucide-angular>
                  </button>
                </div>
              </div>

              <!-- SECURITY mode bar -->
              <div *ngIf="activeMode() === 'security'" class="w-full group">
                <div class="flex items-center justify-between mb-1">
                  <span class="font-mono text-xs text-green-300 flex items-center gap-1">
                    <lucide-angular [img]="ChevronRight" class="w-3 h-3 text-green-600"></lucide-angular>
                    {{ skill.name }}
                  </span>
                  <div class="flex items-center gap-1">
                    <span class="font-mono text-xs text-green-600">{{ skill.level }}%</span>
                    <ng-container *ngIf="!readOnly">
                      <button (click)="startEditSkill(skill)" class="opacity-0 group-hover:opacity-100 text-green-700 hover:text-green-400 transition-all">
                        <lucide-angular [img]="Edit2" class="w-3 h-3"></lucide-angular>
                      </button>
                      <button (click)="deleteSkill(category.id, skill.id)" class="opacity-0 group-hover:opacity-100 text-green-700 hover:text-red-400 transition-all">
                        <lucide-angular [img]="X" class="w-3 h-3"></lucide-angular>
                      </button>
                    </ng-container>
                  </div>
                </div>
                <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-green-600 to-green-400 rounded-full skill-bar-fill"
                       [style.width.%]="skill.level"
                       [style.box-shadow]="'0 0 6px rgba(34,197,94,0.6)'"></div>
                </div>
              </div>

            </ng-container>

            <!-- Edit skill inline -->
            <ng-template #editSkillTpl>
              <div class="w-full flex gap-2 items-center">
                <input [(ngModel)]="newSkillName" placeholder="Skill name"
                       (keyup.enter)="confirmEditSkill(category.id, skill.id)"
                       [class]="'flex-1 text-sm px-2 py-1 rounded border outline-none ' +
                         (activeMode() === 'dev'
                           ? 'border-blue-300 bg-white dark:bg-gray-700 dark:text-white'
                           : 'border-green-500/50 bg-gray-900 text-green-300 font-mono text-xs')" />
                <input *ngIf="activeMode() === 'security'" type="number" min="0" max="100"
                       [(ngModel)]="newSkillLevel"
                       class="w-16 text-xs px-2 py-1 rounded border border-green-500/50 bg-gray-900 text-green-300 font-mono outline-none" />
                <button (click)="confirmEditSkill(category.id, skill.id)"
                        [class]="activeMode() === 'dev' ? 'text-green-500' : 'text-green-400'">
                  <lucide-angular [img]="Check" class="w-4 h-4"></lucide-angular>
                </button>
                <button (click)="cancelAll()"
                        [class]="activeMode() === 'dev' ? 'text-red-400' : 'text-red-500'">
                  <lucide-angular [img]="X" class="w-4 h-4"></lucide-angular>
                </button>
              </div>
            </ng-template>
          </ng-container>
        </div>

        <!-- Add skill inline (solo si la edición en vivo está activa) -->
        <ng-container *ngIf="!readOnly">
          <ng-container *ngIf="addingSkillInCategory() === category.id; else addSkillBtnTpl">
            <div class="flex gap-2 items-center mt-2">
              <input [(ngModel)]="newSkillName" placeholder="Nombre skill"
                     (keyup.enter)="confirmAddSkill(category.id)"
                     [class]="'flex-1 text-sm px-2 py-1 rounded border outline-none ' +
                       (activeMode() === 'dev'
                         ? 'border-blue-300 bg-white dark:bg-gray-700 dark:text-white'
                         : 'border-green-500/50 bg-gray-900 text-green-300 font-mono text-xs')" />
              <input *ngIf="activeMode() === 'security'" type="number" min="0" max="100"
                     [(ngModel)]="newSkillLevel"
                     class="w-16 text-xs px-2 py-1 rounded border border-green-500/50 bg-gray-900 text-green-300 font-mono outline-none" />
              <button (click)="confirmAddSkill(category.id)"
                      [class]="activeMode() === 'dev' ? 'text-green-500' : 'text-green-400'">
                <lucide-angular [img]="Check" class="w-4 h-4"></lucide-angular>
              </button>
              <button (click)="cancelAll()"
                      [class]="activeMode() === 'dev' ? 'text-red-400' : 'text-red-500'">
                <lucide-angular [img]="X" class="w-4 h-4"></lucide-angular>
              </button>
            </div>
          </ng-container>

          <ng-template #addSkillBtnTpl>
            <button (click)="startAddSkill(category.id)"
                    [class]="'w-full flex items-center justify-center gap-1 py-1.5 rounded-lg text-xs font-medium transition-all border border-dashed ' +
                      (activeMode() === 'dev'
                        ? 'border-gray-200 dark:border-gray-600 text-gray-400 hover:text-blue-500 hover:border-blue-300 dark:hover:border-blue-600'
                        : 'border-green-900 text-green-800 hover:text-green-400 hover:border-green-500/50 font-mono')">
              <lucide-angular [img]="Plus" class="w-3 h-3"></lucide-angular>
              <span *ngIf="activeMode() === 'dev'">Agregar skill</span>
              <span *ngIf="activeMode() === 'security'">+ inject skill</span>
            </button>
          </ng-template>
        </ng-container>
      </div>

      <!-- Add category card (solo si la edición en vivo está activa) -->
      <div *ngIf="!readOnly"
           [class]="'rounded-xl transition-all duration-300 border-2 border-dashed flex items-center justify-center min-h-[160px] ' +
             (activeMode() === 'dev'
               ? 'border-gray-200 dark:border-gray-700 hover:border-blue-300 dark:hover:border-blue-700'
               : 'border-green-900 hover:border-green-500/40')">
        <ng-container *ngIf="!addingCategory(); else addCatFormTpl">
          <button (click)="startAddCategory()"
                  [class]="'flex flex-col items-center gap-2 transition-colors ' +
                    (activeMode() === 'dev'
                      ? 'text-gray-400 hover:text-blue-500'
                      : 'text-green-900 hover:text-green-400 font-mono')">
            <lucide-angular [img]="Plus" class="w-6 h-6"></lucide-angular>
            <span class="text-xs font-medium">
              <ng-container *ngIf="activeMode() === 'dev'">Nueva categoría</ng-container>
              <ng-container *ngIf="activeMode() === 'security'">mkdir category</ng-container>
            </span>
          </button>
        </ng-container>

        <ng-template #addCatFormTpl>
          <div class="p-4 w-full flex flex-col gap-2">
            <input [(ngModel)]="newCategoryName" placeholder="Nombre categoría"
                   (keyup.enter)="confirmAddCategory()"
                   [class]="'w-full text-sm px-3 py-2 rounded border outline-none ' +
                     (activeMode() === 'dev'
                       ? 'border-blue-300 bg-white dark:bg-gray-700 dark:text-white'
                       : 'border-green-500/50 bg-gray-900 text-green-300 font-mono text-xs')" />
            <div class="flex gap-2">
              <button (click)="confirmAddCategory()"
                      [class]="'flex-1 py-1.5 rounded text-xs font-medium ' +
                        (activeMode() === 'dev'
                          ? 'bg-blue-600 text-white hover:bg-blue-700'
                          : 'bg-green-900/50 text-green-400 border border-green-500/40 hover:bg-green-900 font-mono')">
                <ng-container *ngIf="activeMode() === 'dev'">Crear</ng-container>
                <ng-container *ngIf="activeMode() === 'security'">exec</ng-container>
              </button>
              <button (click)="cancelAll()"
                      [class]="'flex-1 py-1.5 rounded text-xs font-medium ' +
                        (activeMode() === 'dev'
                          ? 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300'
                          : 'bg-gray-900 text-red-500 border border-red-900 font-mono')">
                <ng-container *ngIf="activeMode() === 'dev'">Cancelar</ng-container>
                <ng-container *ngIf="activeMode() === 'security'">^C</ng-container>
              </button>
            </div>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</section>
