<section id="incidents" class="transition-colors duration-500 max-[575.98px]:py-12 min-[768px]:max-[991.98px]:py-16 min-[992px]:py-20 bg-white/85 dark:bg-gray-900/85 backdrop-blur-sm">

  <div class="w-full px-4 sm:px-6 lg:px-12 relative">

    <!-- Header -->
    <div class="text-center max-[575.98px]:mb-10 min-[768px]:max-[991.98px]:mb-12 min-[992px]:mb-16">
      <h2 class="font-bold text-gray-900 dark:text-white transition-colors
                 max-[575.98px]:text-2xl min-[768px]:max-[991.98px]:text-3xl min-[992px]:text-4xl">
        {{ content().sectionTitle }}
      </h2>
      <p class="mt-4 text-gray-500 dark:text-gray-400 max-w-3xl mx-auto
                max-[575.98px]:text-base min-[992px]:text-xl">
        {{ content().sectionSubtitle }}
      </p>
    </div>

    <!-- Incidents Grid -->
    <div class="grid gap-6 max-w-5xl mx-auto
                max-[575.98px]:grid-cols-1
                min-[768px]:grid-cols-2">

      @for (incident of content().incidents; track incident.id; let i = $index) {
        <div class="rounded-xl fade-in-up transition-all duration-300 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:shadow-lg p-6"
             [style.animation-delay.ms]="i * 100">

          <div class="flex items-start gap-4">
            <div class="bg-blue-100 dark:bg-blue-900/50 rounded-lg w-11 h-11 shrink-0 flex items-center justify-center">
              <lucide-angular [img]="ShieldAlert" class="text-blue-600 dark:text-blue-400 h-5 w-5"></lucide-angular>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap items-center gap-2 mb-1">
                <h3 class="font-bold text-gray-900 dark:text-white text-lg">
                  {{ incident.title }}
                </h3>
              </div>
              <div class="flex items-center gap-2 mb-3">
                <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-400">
                  {{ incident.category }}
                </span>
                <span class="text-xs text-gray-500 dark:text-gray-400">{{ incident.date }}</span>
              </div>
              <p class="text-gray-600 dark:text-gray-400 text-sm leading-relaxed">
                {{ incident.summary }}
              </p>
            </div>
          </div>

        </div>
      }

    </div>
  </div>
</section>
