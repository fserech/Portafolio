<section id="about" class="transition-colors duration-500 max-[575.98px]:py-12 min-[768px]:max-[991.98px]:py-16 min-[992px]:py-20 bg-white/85 dark:bg-gray-900/85 backdrop-blur-sm">

  <div class="w-full px-4 sm:px-6 lg:px-12 relative">

    <!-- Header -->
    <div class="text-center max-[575.98px]:mb-10 min-[768px]:max-[991.98px]:mb-12 min-[992px]:mb-16">
      <h2 class="font-bold text-gray-900 dark:text-white transition-colors
                 max-[575.98px]:text-2xl min-[768px]:max-[991.98px]:text-3xl min-[992px]:text-4xl">
        {{ content().sectionTitle }}
      </h2>
      <p class="mt-4 text-gray-500 dark:text-gray-400 max-w-3xl mx-auto
                max-[575.98px]:text-base min-[992px]:text-xl">
        {{ content().sectionSubtitle }}
      </p>
    </div>

    <!-- Bottom banner -->
    <div class="rounded-2xl overflow-hidden relative mt-4 bg-gray-200 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 p-12">
      <div class="relative z-10">
        <h3 class="font-bold mb-4 text-gray-900 dark:text-white text-2xl">
          {{ content().bannerTitle }}
        </h3>
        <p class="mb-0 text-gray-700 dark:text-gray-300 text-lg">
          {{ content().bannerText }}
        </p>
      </div>
      <div class="absolute -bottom-24 -right-24 w-64 h-64 rounded-full blur-3xl bg-blue-300/20 dark:bg-blue-500/10"></div>
    </div>
  </div>
</section>
