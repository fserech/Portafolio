<div *ngIf="visible()"
     class="fixed inset-0 z-[999] flex items-center justify-center p-4"
     (click)="onBackdropClick($event)">

  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>

  <!-- Modal -->
  <div class="relative w-full max-w-sm bg-gray-900 border border-green-500/30 rounded-2xl p-8
              shadow-[0_0_60px_rgba(34,197,94,0.15)] animate-modal">

    <!-- Header terminal -->
    <div class="flex items-center gap-2 mb-6">
      <div class="flex gap-1.5">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500/70"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-yellow-500/70"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-green-500/70"></span>
      </div>
      <span class="font-mono text-xs text-green-700 flex-1 text-center">sudo --authenticate</span>
    </div>

    <!-- Icon -->
    <div class="flex justify-center mb-4">
      <div class="w-14 h-14 rounded-full bg-green-500/10 border border-green-500/30 flex items-center justify-center">
        <lucide-angular [img]="Shield" class="w-7 h-7 text-green-400"></lucide-angular>
      </div>
    </div>

    <h2 class="text-center font-mono font-bold text-green-300 text-lg mb-1">Acceso Admin</h2>
    <p class="text-center font-mono text-green-700 text-xs mb-6">
      Ingresa tu PIN para habilitar la edición
    </p>

    <!-- PIN input -->
    <div class="relative mb-4">
      <input
        #pinInput
        [type]="showPin() ? 'text' : 'password'"
        [(ngModel)]="pinValue"
        (keyup.enter)="submit()"
        placeholder="••••••••"
        maxlength="32"
        class="w-full font-mono text-sm text-green-300 bg-gray-950 border border-green-500/30
               focus:border-green-500/70 outline-none rounded-xl px-4 py-3 pr-10
               placeholder-green-900 tracking-widest transition-all
               focus:shadow-[0_0_12px_rgba(34,197,94,0.2)]" />

      <!-- ✅ Usando método en vez de arrow function -->
      <button (click)="toggleShowPin()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-green-700 hover:text-green-400 transition-colors">
        <lucide-angular [img]="showPin() ? EyeOff : Eye" class="w-4 h-4"></lucide-angular>
      </button>
    </div>

    <!-- Error message -->
    <p *ngIf="errorMsg()" class="font-mono text-xs text-red-400 mb-4 flex items-center gap-1">
      <lucide-angular [img]="AlertCircle" class="w-3.5 h-3.5"></lucide-angular>
      {{ errorMsg() }}
    </p>

    <!-- Attempts warning -->
    <p *ngIf="attempts() > 0 && attempts() < 3" class="font-mono text-xs text-yellow-600 mb-4">
      <span class="text-yellow-500">[WARN]</span> Intentos fallidos: {{ attempts() }}/3
    </p>

    <!-- Blocked -->
    <div *ngIf="isBlocked()"
         class="font-mono text-xs text-red-500 mb-4 p-3 bg-red-900/20 border border-red-900 rounded-lg">
      <span class="text-red-400">[ERROR]</span> Demasiados intentos. Espera {{ blockSeconds() }}s.
    </div>

    <!-- Buttons -->
    <div class="flex gap-3">
      <button (click)="close()"
              class="flex-1 py-2.5 rounded-xl font-mono text-sm text-gray-500 border border-gray-700
                     hover:border-gray-500 hover:text-gray-300 transition-all">
        ^C cancel
      </button>
      <button (click)="submit()"
              [disabled]="loading() || isBlocked()"
              class="flex-1 py-2.5 rounded-xl font-mono text-sm font-bold transition-all
                     bg-green-900/40 text-green-400 border border-green-500/40
                     hover:bg-green-900/60 hover:shadow-[0_0_16px_rgba(34,197,94,0.25)]
                     disabled:opacity-40 disabled:cursor-not-allowed">
        <span *ngIf="!loading()">exec login</span>
        <span *ngIf="loading()" class="flex items-center justify-center gap-2">
          <span class="terminal-cursor">▋</span> autenticando...
        </span>
      </button>
    </div>
  </div>
</div>
