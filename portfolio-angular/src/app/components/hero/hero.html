<section id="home" class="relative min-h-screen flex items-center pt-16 overflow-hidden bg-gray-50 dark:bg-gray-950 transition-colors duration-300">
  <div class="w-full px-4 sm:px-6 lg:px-12">
    <!-- Mobile: max-width: 575.98px -->
    <!-- Tablet: min-width: 768px and max-width: 991.98px -->
    <!-- Desktop: min-width: 992px and max-width: 1199.98px -->
    <!-- Extra Large: min-width: 1200px -->

    <div class="grid grid-cols-1 max-[575.98px]:grid-cols-1 min-[768px]:max-[991.98px]:grid-cols-1 min-[992px]:grid-cols-2 gap-12 items-center">

      <!-- Content -->
      <div class="order-2 min-[992px]:order-1 min-[992px]:pr-12 fade-in-left">
        <!-- Badge - ajustado por breakpoint -->
        <span class="inline-block px-3 py-1 text-sm font-semibold text-blue-600 dark:text-blue-400 bg-blue-100 dark:bg-blue-900/30 rounded-full mb-4 transition-colors
                     max-[575.98px]:text-xs max-[575.98px]:px-2.5 max-[575.98px]:py-0.5
                     min-[768px]:max-[991.98px]:text-sm
                     min-[992px]:max-[1199.98px]:text-sm
                     min-[1200px]:text-base">
           fredy@dev
        </span>

        <!-- Heading - tamaños específicos por breakpoint -->
        <h1 class="font-extrabold text-gray-900 dark:text-white leading-tight mb-6 transition-colors
                   max-[575.98px]:text-3xl max-[575.98px]:mb-4
                   min-[768px]:max-[991.98px]:text-4xl min-[768px]:max-[991.98px]:mb-5
                   min-[992px]:max-[1199.98px]:text-5xl min-[992px]:max-[1199.98px]:mb-6
                   min-[1200px]:text-7xl min-[1200px]:mb-6">
          Desarrollando aplicaciones empresariales
          <span class="text-blue-600 dark:text-blue-500">modernas</span> y
          <span class="text-blue-600 dark:text-blue-500">sistemas de gestión completos</span>
        </h1>

        <!-- Description - ajustado por breakpoint -->
        <p class="text-gray-600 dark:text-gray-400 mb-8 max-w-2xl transition-colors
                  max-[575.98px]:text-base max-[575.98px]:mb-6
                  min-[768px]:max-[991.98px]:text-lg min-[768px]:max-[991.98px]:mb-7
                  min-[992px]:max-[1199.98px]:text-lg min-[992px]:max-[1199.98px]:mb-8
                  min-[1200px]:text-lg min-[1200px]:mb-8">
          Especializado en construir interfaces de usuario excepcionales y accesibles.
          Transformo diseños en código limpio y escalable usando tecnologías de vanguardia.
        </p>

        <!-- Buttons - layout responsivo específico -->
        <div class="flex gap-4 mb-8
                    max-[575.98px]:flex-col max-[575.98px]:mb-6
                    min-[768px]:max-[991.98px]:flex-row min-[768px]:max-[991.98px]:mb-7
                    min-[992px]:flex-row">
          <a href="#projects"
             class="inline-flex justify-center items-center border border-transparent font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 dark:bg-blue-600 dark:hover:bg-blue-500 transition-colors shadow-lg shadow-blue-500/30 dark:shadow-blue-500/20
                    max-[575.98px]:px-5 max-[575.98px]:py-2.5 max-[575.98px]:text-sm
                    min-[768px]:max-[991.98px]:px-6 min-[768px]:max-[991.98px]:py-3 min-[768px]:max-[991.98px]:text-base
                    min-[992px]:max-[1199.98px]:px-6 min-[992px]:max-[1199.98px]:py-3 min-[992px]:max-[1199.98px]:text-base
                    min-[1200px]:px-6 min-[1200px]:py-3 min-[1200px]:text-base">
            Ver Proyectos
            <lucide-angular [img]="ArrowRight" class="ml-2 h-4 w-4"></lucide-angular>
          </a>
          <a href="#contact"
             class="inline-flex justify-center items-center border border-gray-300 dark:border-gray-700 font-medium rounded-lg text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors
                    max-[575.98px]:px-5 max-[575.98px]:py-2.5 max-[575.98px]:text-sm
                    min-[768px]:max-[991.98px]:px-6 min-[768px]:max-[991.98px]:py-3 min-[768px]:max-[991.98px]:text-base
                    min-[992px]:max-[1199.98px]:px-6 min-[992px]:max-[1199.98px]:py-3 min-[992px]:max-[1199.98px]:text-base
                    min-[1200px]:px-6 min-[1200px]:py-3 min-[1200px]:text-base">
            Contactar
          </a>
        </div>

        <!-- Social Links -->
        <div class="flex items-center gap-6 text-gray-500 dark:text-gray-400
                    max-[575.98px]:gap-4 max-[575.98px]:justify-center
                    min-[768px]:max-[991.98px]:gap-5
                    min-[992px]:gap-6">
          <a href="https://github.com/fserech" target="_blank" rel="noopener noreferrer"
             class="hover:text-gray-900 dark:hover:text-white transition-colors">
            <lucide-angular [img]="Github"
                           class="max-[575.98px]:w-5 max-[575.98px]:h-5
                                  min-[768px]:max-[991.98px]:w-6 min-[768px]:max-[991.98px]:h-6
                                  min-[992px]:w-6 min-[992px]:h-6"></lucide-angular>
          </a>
          <a href="https://www.linkedin.com/in/fredy-serech-08a11a246" target="_blank" rel="noopener noreferrer"
             class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
            <lucide-angular [img]="Linkedin"
                           class="max-[575.98px]:w-5 max-[575.98px]:h-5
                                  min-[768px]:max-[991.98px]:w-6 min-[768px]:max-[991.98px]:h-6
                                  min-[992px]:w-6 min-[992px]:h-6"></lucide-angular>
          </a>
          <a href="mailto:serech63@gmail.com"
             class="hover:text-red-500 dark:hover:text-red-400 transition-colors">
            <lucide-angular [img]="Mail"
                           class="max-[575.98px]:w-5 max-[575.98px]:h-5
                                  min-[768px]:max-[991.98px]:w-6 min-[768px]:max-[991.98px]:h-6
                                  min-[992px]:w-6 min-[992px]:h-6"></lucide-angular>
          </a>
        </div>
      </div>

      <!-- Image -->
      <div class="order-1 min-[992px]:order-2 relative fade-in-right">
        <div class="relative rounded-2xl overflow-hidden shadow-2xl w-full
                    max-[575.98px]:aspect-[16/9] max-[575.98px]:rounded-xl
                    min-[768px]:max-[991.98px]:aspect-[16/9] min-[768px]:max-[991.98px]:rounded-2xl
                    min-[992px]:max-[1199.98px]:aspect-auto min-[992px]:max-[1199.98px]:h-[70vh]
                    min-[1200px]:aspect-auto min-[1200px]:h-[80vh]">
          <div class="absolute inset-0 bg-gradient-to-tr from-blue-600/20 to-transparent mix-blend-overlay z-10"></div>
          <img [src]="imageUrl"
               alt="Developer Workspace"
               class="w-full h-full object-cover">
        </div>

        <!-- Decorative elements - ocultos en mobile -->
        <div class="absolute -bottom-6 -left-6 w-24 h-24 bg-dots-pattern opacity-50 dark:opacity-20
                    max-[575.98px]:hidden
                    min-[768px]:max-[991.98px]:hidden
                    min-[992px]:block"></div>
        <div class="absolute -top-6 -right-6 w-32 h-32 bg-blue-100 dark:bg-blue-900/30 rounded-full -z-10 blur-3xl transition-colors
                    max-[575.98px]:hidden
                    min-[768px]:max-[991.98px]:hidden
                    min-[992px]:block"></div>
      </div>
    </div>
  </div>
</section>
