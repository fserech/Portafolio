<section id="home" class="relative min-h-screen flex items-center pt-16 overflow-hidden bg-gray-50 dark:bg-gray-950 transition-colors duration-300">
  <div class="w-full px-4 sm:px-6 lg:px-12">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">

      <!-- Content -->
      <div class="order-2 lg:order-1 lg:pr-12 fade-in-left">
        <span class="inline-block px-3 py-1 text-sm font-semibold text-blue-600 dark:text-blue-400 bg-blue-100 dark:bg-blue-900/30 rounded-full mb-4 transition-colors">
           fredy@dev
        </span>

        <h1 class="text-4xl sm:text-5xl lg:text-7xl font-extrabold text-gray-900 dark:text-white leading-tight mb-6 transition-colors">
          Desarrollando aplicaciones empresariales
          <span class="text-blue-600 dark:text-blue-500">modernas</span> y
          <span class="text-blue-600 dark:text-blue-500">sistemas de gestión completos</span>
        </h1>

        <p class="text-lg text-gray-600 dark:text-gray-400 mb-8 max-w-2xl transition-colors">
          Especializado en construir interfaces de usuario excepcionales y accesibles.
          Transformo diseños en código limpio y escalable usando tecnologías de vanguardia.
        </p>

        <div class="flex flex-col sm:flex-row gap-4 mb-8">
          <a href="#projects"
             class="inline-flex justify-center items-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 dark:bg-blue-600 dark:hover:bg-blue-500 transition-colors shadow-lg shadow-blue-500/30 dark:shadow-blue-500/20">
            Ver Proyectos
            <lucide-angular [img]="ArrowRight" class="ml-2 h-4 w-4"></lucide-angular>
          </a>
          <a href="#contact"
             class="inline-flex justify-center items-center px-6 py-3 border border-gray-300 dark:border-gray-700 text-base font-medium rounded-lg text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
            Contactar
          </a>
        </div>

        <div class="flex items-center gap-6 text-gray-500 dark:text-gray-400">
          <a href="https://github.com/fserech" target="_blank" rel="noopener noreferrer" class="hover:text-gray-900 dark:hover:text-white transition-colors">
          <lucide-angular [img]="Github" [size]="24"></lucide-angular>
          </a>
          <a href="https://www.linkedin.com/in/fredy-serech-08a11a246" target="_blank" rel="noopener noreferrer" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
            <lucide-angular [img]="Linkedin" [size]="24"></lucide-angular>
          </a>
          <a href="mailto:serech63@gmail.com" class="hover:text-red-500 dark:hover:text-red-400 transition-colors">
            <lucide-angular [img]="Mail" [size]="24"></lucide-angular>
          </a>
        </div>
      </div>

      <!-- Image -->
      <div class="order-1 lg:order-2 relative fade-in-right">
        <div class="relative rounded-2xl overflow-hidden shadow-2xl aspect-[16/9] lg:aspect-auto lg:h-[80vh] w-full">
          <div class="absolute inset-0 bg-gradient-to-tr from-blue-600/20 to-transparent mix-blend-overlay z-10"></div>
          <img [src]="imageUrl"
               alt="Developer Workspace"
               class="w-full h-full object-cover">
        </div>
        <div class="absolute -bottom-6 -left-6 w-24 h-24 bg-dots-pattern opacity-50 dark:opacity-20 hidden lg:block"></div>
        <div class="absolute -top-6 -right-6 w-32 h-32 bg-blue-100 dark:bg-blue-900/30 rounded-full -z-10 blur-3xl transition-colors"></div>
      </div>
    </div>
  </div>
</section>
