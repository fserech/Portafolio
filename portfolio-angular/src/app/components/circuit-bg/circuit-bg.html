<svg [class.security]="isSecurity" viewBox="0 0 680 600" preserveAspectRatio="xMidYMid slice"
  role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Circuito de fondo</title>

  <defs>
    <radialGradient id="vignette" cx="76%" cy="50%" r="65%">
      <stop offset="0%"  [attr.stop-color]="'var(--c-vig-1)'" stop-opacity="0"/>
      <stop offset="75%" [attr.stop-color]="'var(--c-vig-2)'" stop-opacity="0.55"/>
      <stop offset="100%" [attr.stop-color]="'var(--c-vig-3)'" stop-opacity="0.9"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" style="fill:var(--c-dot)" opacity="0.35"/>
    </pattern>
    <path id="t1" d="M20,60 H220 V160 H400 V300 H472" fill="none"/>
    <path id="t2" d="M20,540 H180 V420 H360 V300 H472" fill="none"/>
    <path id="t3" d="M660,40 V150 H480 V300 H472" fill="none"/>
    <path id="t4" d="M660,560 V450 H480 V300 H472" fill="none"/>
    <path id="t5" d="M20,300 H150 V240 H320 V300 H472" fill="none"/>
    <path id="t6" d="M340,20 V120 H430 V300 H472" fill="none"/>
  </defs>

  @if (!ambient) {
    <ng-container>
      <rect x="0" y="0" width="680" height="600" [style]="'fill:var(--c-bg)'" [attr.opacity]="ambient ? 0.35 : 1"/>
      <rect x="0" y="0" width="680" height="600" fill="url(#dots)" [attr.opacity]="ambient ? 0.5 : 1"/>
    </ng-container>
  }

  <g fill="none" style="stroke:var(--c-primary)" [attr.stroke-width]="ambient ? 3.5 : 1.5" [attr.opacity]="ambient ? 1 : 0.55">
    <use href="#t1"/><use href="#t2"/><use href="#t5"/>
  </g>
  <g fill="none" style="stroke:var(--c-secondary)" [attr.stroke-width]="ambient ? 3 : 1" [attr.opacity]="ambient ? 1 : 0.4">
    <use href="#t3"/><use href="#t4"/><use href="#t6"/>
  </g>

  <g fill="none" style="stroke:var(--c-accent)" stroke-width="2" [attr.opacity]="ambient ? 0.9 : 0.5" stroke-dasharray="5 9">
    <use href="#t1"/>
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.8s" repeatCount="indefinite"/>
  </g>
  <g fill="none" style="stroke:var(--c-flow)" stroke-width="2" [attr.opacity]="ambient ? 0.85 : 0.45" stroke-dasharray="4 10">
    <use href="#t4"/>
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <g style="fill:var(--c-node)">
    <circle cx="220" cy="160" [attr.r]="ambient ? 4.5 : 3.5"/><circle cx="400" cy="160" [attr.r]="ambient ? 4.5 : 3.5"/>
    <circle cx="180" cy="540" [attr.r]="ambient ? 4.5 : 3.5"/><circle cx="360" cy="420" [attr.r]="ambient ? 4.5 : 3.5"/>
    <circle cx="480" cy="150" [attr.r]="ambient ? 4.5 : 3.5"/><circle cx="480" cy="450" [attr.r]="ambient ? 4.5 : 3.5"/>
    <circle cx="150" cy="300" [attr.r]="ambient ? 4.5 : 3.5"/><circle cx="320" cy="240" [attr.r]="ambient ? 4.5 : 3.5"/>
    <circle cx="430" cy="120" [attr.r]="ambient ? 4.5 : 3.5"/>
  </g>

  <circle cx="220" cy="160" r="3" fill="none" style="stroke:var(--c-node-glow)" stroke-width="1.2">
    <animate attributeName="r" values="3;9;3" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="420" r="3" fill="none" style="stroke:var(--c-node-glow)" stroke-width="1.2">
    <animate attributeName="r" values="3;9;3" dur="3.1s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="3.1s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <circle r="4" style="fill:var(--c-node-glow)">
    <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion>
  </circle>
  <circle r="4" style="fill:var(--c-node-glow)">
    <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#t4"/></animateMotion>
  </circle>

  <polygon points="520,252 561.6,276 561.6,324 520,348 478.4,324 478.4,276"
    fill="none" style="stroke:var(--c-core-line)" stroke-width="2" [attr.opacity]="ambient ? 1 : 0.7"/>
    <polygon points="520,270 546,285 546,315 520,330 494,315 494,285"
      [style]="ambient ? 'fill:transparent; stroke:var(--c-core-line)' : 'fill:var(--c-core-fill); stroke:var(--c-core-line)'" stroke-width="1.8"/>
      <circle cx="520" cy="300" r="9" style="fill:var(--c-core-glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>

      @if (!ambient) {
        <rect x="0" y="0" width="680" height="600" fill="url(#vignette)"/>
      }
    </svg>
