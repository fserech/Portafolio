<section id="projects" class="py-20 bg-white dark:bg-gray-900 transition-colors duration-300">
  <div class="w-full px-4 sm:px-6 lg:px-12">
    <div class="text-center mb-16">
      <h2 class="text-3xl font-bold text-gray-900 dark:text-white sm:text-4xl transition-colors">
        Proyectos Destacados
      </h2>
      <p class="mt-4 text-xl text-gray-500 dark:text-gray-400 max-w-3xl mx-auto transition-colors">
        Una selección de mis trabajos recientes donde aplico mis conocimientos.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let project of projects; let i = index"
           class="bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-100 dark:border-gray-700 hover:shadow-xl dark:hover:shadow-blue-900/10 transition-all duration-300 group flex flex-col project-card"
           [style.animation-delay.ms]="i * 200">

        <div class="relative h-64 overflow-hidden">
          <img [src]="project.image"
               [alt]="project.title"
               class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">

          <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-4">
            <a [href]="project.demoUrl"
               class="p-3 bg-white rounded-full text-gray-900 hover:bg-blue-600 hover:text-white transition-colors transform hover:scale-110"
               title="Ver Demo">
              <lucide-angular [img]="ExternalLink" [size]="24"></lucide-angular>
            </a>
            <a [href]="project.repoUrl"
               class="p-3 bg-white rounded-full text-gray-900 hover:bg-gray-900 hover:text-white transition-colors transform hover:scale-110"
               title="Ver Código">
              <lucide-angular [img]="Github" [size]="24"></lucide-angular>
            </a>
          </div>
        </div>

        <div class="p-8 flex-1 flex flex-col">
          <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-3 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
            {{ project.title }}
          </h3>
          <p class="text-gray-600 dark:text-gray-400 mb-6 line-clamp-3 transition-colors flex-1">
            {{ project.description }}
          </p>
          <div class="flex flex-wrap gap-2 mt-auto pt-4 border-t border-gray-100 dark:border-gray-700">
            <span *ngFor="let tag of project.tags"
                  class="px-3 py-1 bg-blue-50 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 text-xs rounded-full font-medium transition-colors">
              {{ tag }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
