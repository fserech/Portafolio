<section id="projects" class="transition-colors duration-500 max-[575.98px]:py-12 min-[768px]:max-[991.98px]:py-16 min-[992px]:py-20 bg-white/85 dark:bg-gray-900/85 backdrop-blur-sm">

  <div class="w-full px-4 sm:px-6 lg:px-12 relative">

    <!-- ── Header ─────────────────────────────────────────────────────── -->
    <div class="text-center max-[575.98px]:mb-10 min-[768px]:max-[991.98px]:mb-12 min-[992px]:mb-16">
      <h2 class="font-bold text-gray-900 dark:text-white max-[575.98px]:text-2xl min-[768px]:text-3xl min-[992px]:text-4xl">
        Proyectos Destacados
      </h2>
      <p class="mt-4 text-gray-500 dark:text-gray-400 max-w-3xl mx-auto max-[575.98px]:text-base min-[992px]:text-xl">
        Una selección de trabajos en seguridad e infraestructura, y de desarrollo de software.
      </p>
    </div>

    <!-- ── Project Cards Grid ─────────────────────────────────────────── -->
    <div class="grid max-[575.98px]:grid-cols-1 max-[575.98px]:gap-4
                min-[768px]:max-[991.98px]:grid-cols-2 min-[768px]:max-[991.98px]:gap-5
                min-[992px]:max-[1199.98px]:grid-cols-3 min-[992px]:max-[1199.98px]:gap-5
                min-[1200px]:grid-cols-3 min-[1200px]:gap-6">

      @for (project of projects(); track project.id; let i = $index) {
        <div class="rounded-xl skill-card transition-all duration-300 bg-white dark:bg-gray-800 shadow-sm hover:shadow-md border border-gray-100 dark:border-gray-700 p-6 flex flex-col"
             [style.animation-delay.ms]="i * 100">
          <div class="flex items-center justify-between pb-2 mb-4 border-b border-gray-100 dark:border-gray-700">
            <h3 class="font-bold text-gray-900 dark:text-white text-lg">{{ project.title }}</h3>
          </div>
          <p class="text-gray-600 dark:text-gray-400 text-sm leading-relaxed mb-4 flex-1">{{ project.description }}</p>
          <div class="flex flex-wrap gap-2 mb-4">
            @for (tag of project.tags; track tag) {
              <span class="px-2.5 py-1 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-full text-xs font-medium">
                {{ tag }}
              </span>
            }
          </div>
          <div class="flex gap-4 mt-auto pt-2 border-t border-gray-100 dark:border-gray-700">
            <a [href]="project.demoUrl" target="_blank"
               class="flex items-center gap-1.5 text-xs font-semibold text-blue-600 dark:text-blue-400 hover:underline">
              <lucide-angular [img]="ExternalLink" class="w-3.5 h-3.5"></lucide-angular> Demo
            </a>
            <a [href]="project.repoUrl" target="_blank"
               class="flex items-center gap-1.5 text-xs font-semibold text-gray-600 dark:text-gray-300 hover:underline">
              <lucide-angular [img]="Github" class="w-3.5 h-3.5"></lucide-angular> Repo
            </a>
          </div>
        </div>
      }
    </div>
  </div>
</section>
