<div class="min-h-screen bg-white dark:bg-gray-950 font-sans text-gray-900 dark:text-gray-100 scroll-smooth transition-colors duration-300">

  <!-- ── Modal de login GLOBAL — una sola instancia para toda la app ── -->
  <app-admin-login (loginSuccess)="onLoginSuccess()"></app-admin-login>

  <!-- ── Botón flotante admin (esquina inferior derecha) ──────────────
       Invisible para visitantes normales: muy pequeño, sin label,
       solo aparece al hacer hover en esa esquina.
       Cuando está autenticado muestra el badge verde + logout.        -->
  <div class="fixed bottom-6 right-6 z-[998] flex flex-col items-end gap-2">

    <!-- Sin sesión: botón candado casi invisible -->
    <button *ngIf="!auth.isAuthenticated()"
            (click)="openLogin()"
            class="w-8 h-8 flex items-center justify-center rounded-full
                   bg-transparent text-gray-300/30 dark:text-gray-700/30
                   hover:bg-gray-100 dark:hover:bg-gray-800
                   hover:text-gray-500 dark:hover:text-gray-400
                   transition-all duration-300 opacity-20 hover:opacity-100"
            title="Admin">
      <!-- Candado SVG inline para no necesitar import de lucide aquí -->
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </button>

    <!-- Con sesión: badge verde + botón logout -->
    <div *ngIf="auth.isAuthenticated()"
         class="flex items-center gap-2 px-3 py-1.5 rounded-full
                bg-green-900/80 border border-green-500/40
                text-green-400 text-xs font-mono backdrop-blur-sm
                shadow-[0_0_16px_rgba(34,197,94,0.2)]">
      <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span>
      edit mode
      <button (click)="logout()"
              class="ml-1 opacity-60 hover:opacity-100 transition-opacity"
              title="Cerrar sesión">
        <!-- Logout SVG inline -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── Indicador global de guardado ────────────────────────────────── -->
  <app-navbar></app-navbar>
  <main>
    <app-hero [imageUrl]="heroImage"></app-hero>
    <app-about></app-about>
    <app-skills></app-skills>
    <app-projects></app-projects>
    <app-contact></app-contact>
  </main>
  <app-footer></app-footer>
</div>
